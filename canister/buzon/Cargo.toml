[package]
name = "x39_buzon"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ic-cdk = "0.17"
candid = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
# Solo para verificar entradas del directorio (firma ML-DSA-87 y clave ML-KEM); sin generador aleatorio.
x39-core = { path = "../../x39-core", default-features = false }

[dev-dependencies]
# Los tests nativos sí generan claves de prueba.
x39-core = { path = "../../x39-core", features = ["rng"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
