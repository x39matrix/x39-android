[package]
name = "x39-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
libcrux-ml-kem = "0.0.10"
# Misma implementación ML-DSA-87 que el canister Joseph: sus firmas se verifican igual en ambos lados.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
sha2 = "0.11.0"
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
