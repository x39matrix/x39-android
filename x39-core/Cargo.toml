[package]
name = "x39-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["rng"]
# Sin `rng` no hay generador aleatorio: solo verificar y leer formatos. Así compila en el canister
# (wasm32-unknown-unknown), que solo necesita comprobar firmas.
rng = ["dep:getrandom"]

[dependencies]
aes-gcm = "0.11.1"
getrandom = { version = "0.4.3", optional = true }
hkdf = "0.13.0"
hmac = "0.13.0"
libcrux-ml-kem = "0.0.10"
# Misma implementación ML-DSA-87 que el canister Joseph: sus firmas se verifican igual en ambos lados.
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc", "zeroize"] }
sha2 = "0.11.0"
zeroize = "1.9.0"

[dev-dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
