[package]
name = "x39-hub-jni"
version = "0.1.0"
edition = "2024"

[lib]
name = "x39hub"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.22.4"
x39-core = { path = "../x39-core" }
x39-hub = { path = "../x39-hub" }
zeroize = "1.9.0"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
