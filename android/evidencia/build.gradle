plugins {
    id 'com.android.application'
}

// X-39 Evidencia: fotos y archivos con huella, firma ML-DSA-87 y ancla OpenTimestamps.
// App distinta de la mensajería: su manifiesto sí pide internet (solo huellas de 32 bytes) y cámara.
android {
    namespace 'org.x39matrix.evidencia'
    compileSdk 35

    defaultConfig {
        applicationId 'org.x39matrix.evidencia'
        minSdk 28
        targetSdk 35
        versionCode 15
        versionName '0.3.2'
    }

    // Firma de publicación de X-39. Nada secreto en este fichero: scripts/build_evidencia_release.sh pide la
    // contraseña sin eco y la pasa solo al proceso de Gradle. Sin X39_KEYSTORE sale un APK release sin firmar.
    signingConfigs {
        release {
            def almacen = System.getenv('X39_KEYSTORE')
            if (almacen) {
                storeFile file(almacen)
                // keytool de JDK 17 crea PKCS12 aunque el fichero se llame .jks.
                storeType 'pkcs12'
                storePassword System.getenv('X39_STORE_PASS')
                keyAlias System.getenv('X39_KEY_ALIAS') ?: 'x39'
                keyPassword System.getenv('X39_KEY_PASS') ?: System.getenv('X39_STORE_PASS')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            // Sin R8: no hay dependencias que recortar y los nativos JNI dependen de los nombres de X39Core.
            minifyEnabled false
            debuggable false
            if (System.getenv('X39_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Piezas comunes con la mensajería: puente al motor Rust, bóveda Keystore, iconos y paleta.
            java.srcDirs += ['../comun/java']
            // Chat común con x39 (un solo módulo para las dos apps): ~/x39-chat. NO lo usa bolsillo.
            java.srcDirs += ['../../../x39-chat/java']
            // Mismo motor Rust (libx39jni.so) que compila scripts/build_apk.sh.
            jniLibs.srcDirs = ['../app/src/main/jniLibs']
        }
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

// Google 0: nada de Google. Solo Android framework + libx39jni.so (Rust) y, para el chat,
// OkHttp (Square, código abierto): el MISMO transporte WebSocket que usa x39.
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
